server {
  listen 80;
  server_name _;
  location /key3in/api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Prefix /key3in; }
  location /key3in/ { root /usr/share/nginx/html; try_files $uri $uri/ /key3in/index.html; }
}
